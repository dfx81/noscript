name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - public/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    uses: qlyco/qwc/.github/workflows/deploy.yml@v0.0.1
    with:
      version: v0.0.1
      root: public
