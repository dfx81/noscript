<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.title}}</title>
  <meta name="description" content="{{ .description }}" />
  {{template "includes/styling/base" .}}
  <noscript>{{template "includes/styling/noscript" .}}</noscript>
  {{block "head" .}}{{end}}
</head>
<body>
    <main class="js-only">
        <p>Please disable Javascript and reload the page.</p>
    </main>
    <noscript>
        <main>
            {{block "content" .}}Javascript Disabled{{end}}
        </main>
    </noscript>
</body>
</html>
